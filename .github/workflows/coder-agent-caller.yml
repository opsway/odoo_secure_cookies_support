name: Trigger Coder Agent
# Copy this workflow to the repository where you want AI agent to work with the code
on:
  workflow_dispatch:                       # lets you (or Jira) call the API
    inputs:
      jira_id: # ← appears in UI and API
        description: "Jira ticket ID"
        required: true
        type: string
      spent:
        description: "Spent budget"
        required: true
        type: string
        default: "0"
      budget:
        description: "Budget"
        required: true
        type: string
        default: "2"
      qa_note:
        description: "Note from QA"
        required: false
        type: string

  repository_dispatch: # Triggered by repository-dispatch event
    types: [ coder-flow ]

run-name: Trigger Coder Agent for ${{ inputs.jira_id }}

jobs:
  coder-agent:
    env:
      BRANCH: ${{ (github.event.client_payload.is_test == 'true' && 'dev') || 'master' }}
    uses: opsway/ai_tooling/.github/workflows/coder-agent.yml@${{ env.BRANCH }}
    with:
      jira_id:  ${{ inputs.jira_id || github.event.client_payload.jira_id }}
      spent:   ${{ inputs.spent || github.event.client_payload.spent }}
      budget:   ${{ inputs.budget || github.event.client_payload.budget }}
      qa_note: ${{ inputs.qa_note || github.event.client_payload.qa_note }}
      stage_branch: ${{ vars.STAGE_BRANCH }}
      starting_branch: ${{ github.event.repository.default_branch }}
      feature_branch: 'feature/${{ inputs.jira_id }}-ai'
      jira_username: ${{ vars.JIRA_USERNAME }}
      jira_url: ${{ vars.JIRA_URL }}
      init_odoo_addons: ${{ vars.INITIAL_ODOO_ADDONS }}
      DOCKER_COMPOSE_DIR: ${{ vars.DOCKER_COMPOSE_DIR }}
      ENTERPRISE_DIR: ${{ vars.ENTERPRISE_DIR }}
      ODOO_SERVICE_NAME: ${{ vars.ODOO_SERVICE_NAME }}
      DATABASE_SERVICE_NAME: ${{ vars.DATABASE_SERVICE_NAME }}
      odoo_branch: ${{ vars.ODOO_BRANCH }}
    secrets:
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      ODOO_ENTERPRISE_SECRET: ${{ secrets.ODOO_ENTERPRISE_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
