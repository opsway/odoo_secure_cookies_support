exclude: |
  # Files and folders generated by bots, to avoid loops
  ^setup/|/static/description/index\.html$|
  # We don't want to mess with tool-generated files
  .svg$|/tests/([^/]+/)?cassettes/|^.copier-answers.yml$|^.github/|
  # Library files can have extraneous formatting (even minimized)
  /static/(src/)?lib/|
  # Exclude third-party addon folder from hooks (pylint, autopep8, etc.)
  ^addons_third_party/|
  ^docker/|
  ^env/
default_language_version:
  python: python3
  node: "16.17.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        exclude: ^addons_third_party/
      - id: check-ast
      - id: check-builtin-literals
        exclude: ^addons_third_party/
      - id: check-docstring-first
      - id: check-xml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^addons_third_party/
      - id: trailing-whitespace
        exclude: ^addons_third_party/
  - repo: https://github.com/hhatto/autopep8
    rev: v2.1.0
    hooks:
      - id: autopep8
        name: Auto fix Python code
        args: [ "-i", "-vvv", "--ignore-local-config", "--global-config", ".autopep8" ]
  - repo: https://github.com/OCA/pylint-odoo
    rev: v8.0.19
    hooks:
      - id: pylint_odoo
        name: pylint with Odoo checks
        verbose: true
        args: [ "--rcfile=.pylintrc" ]
        files: ^(?!addons_third_party/).*
  - repo: local
    hooks:
      - id: update-readme-content-list
        name: Update README Content List
        entry: python3 scripts/doc/update_readme_content_list.py
        language: system
        types: [markdown]
        files: ^doc/.*\.md$
