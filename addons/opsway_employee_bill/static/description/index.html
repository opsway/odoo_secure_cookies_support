;html=1;align=center;verticalAlign=middle;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;40\&quot; y=\&quot;70\&quot; width=\&quot;780\&quot; height=\&quot;100\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;qnz8ibrbI4es2f5XtH8H-3\&quot; value=\&quot;&amp;lt;h1 style=&amp;quot;margin-top: 0px;&amp;quot;&amp;gt;Features&amp;lt;/h1&amp;gt;\&quot; style=\&quot;text;html=1;whiteSpace=wrap;overflow=hidden;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;340\&quot; y=\&quot;200\&quot; width=\&quot;120\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;qnz8ibrbI4es2f5XtH8H-5\&quot; value=\&quot;- PE Invoice PDF report in Vendor Bill.\&quot; style=\&quot;text;html=1;align=center;verticalAlign=middle;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;30\&quot; y=\&quot;250\&quot; width=\&quot;240\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;qnz8ibrbI4es2f5XtH8H-6\&quot; value=\&quot;- Company specific Terms and Conditions in PE Invoice report.\&quot; style=\&quot;text;html=1;align=center;verticalAlign=middle;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;30\&quot; y=\&quot;290\&quot; width=\&quot;360\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;qnz8ibrbI4es2f5XtH8H-7\&quot; value=\&quot;- Correlate Product in PE Invoice to follow PE permitted type(s) of activities.\&quot; style=\&quot;text;html=1;align=center;verticalAlign=middle;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;20\&quot; y=\&quot;390\&quot; width=\&quot;440\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;qnz8ibrbI4es2f5XtH8H-8\&quot; value=\&quot;- Translate fields in Res.Partner: Name, Street (1,2), City.&amp;amp;nbsp;\&quot; style=\&quot;text;html=1;align=center;verticalAlign=middle;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;20\&quot; y=\&quot;340\&quot; width=\&quot;350\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;qnz8ibrbI4es2f5XtH8H-9\&quot; value=\&quot;&amp;lt;h1 style=&amp;quot;margin-top: 0px;&amp;quot;&amp;gt;How to work&amp;lt;/h1&amp;gt;\&quot; style=\&quot;text;html=1;whiteSpace=wrap;overflow=hidden;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;327\&quot; y=\&quot;460\&quot; width=\&quot;160\&quot; height=\&quot;40\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;qnz8ibrbI4es2f5XtH8H-10\&quot; value=\&quot;1. Set up Vendor Contact:&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;&amp;amp;nbsp; &amp;amp;nbsp;- fill in Name;&amp;lt;/span&amp;gt;&amp;lt;div&amp;gt;&amp;amp;nbsp; &amp;amp;nbsp;- fill in the Address info;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;&amp;amp;nbsp; &amp;amp;nbsp;- add Email;&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;amp;nbsp; &amp;amp;nbsp;- add Bank account;&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;amp;nbsp; &amp;amp;nbsp;- set Vendor Language, where English language would lead to a mono language PE Invoice report in English; and Ukrainian language would&amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp;provide a multi-language English-Ukraine report;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;amp;nbsp; &amp;amp;nbsp;- if Ukrainian language is set, make sure to add a translation of the following values: Name, Street (1,2), State (if any), City.&amp;lt;/div&amp;gt;\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;60\&quot; y=\&quot;530\&quot; width=\&quot;770\&quot; height=\&quot;70\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;qnz8ibrbI4es2f5XtH8H-11\&quot; value=\&quot;2. Set up Company Contact:&amp;lt;div&amp;gt;&amp;amp;nbsp;- fill in Name;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;amp;nbsp;- fill in the Address info;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;amp;nbsp;- add Email;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;amp;nbsp;- If a multi-language PE Invoice report is supposed to be built, make sure to add a translation of the following values: Name, Street (1,2), State (if any), City;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;amp;nbsp;- add a translation of the mentioned values in English (if absent).&amp;lt;/div&amp;gt;\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;60\&quot; y=\&quot;680\&quot; width=\&quot;760\&quot; height=\&quot;30\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;qnz8ibrbI4es2f5XtH8H-13\&quot; value=\&quot;3. Add specific Terms and Conditions to propagate in PE Invoice report (if any): go to Bill Info section in res.company.. Add a translation of&amp;lt;div&amp;gt;&amp;amp;nbsp; &amp;amp;nbsp;the added information..&amp;lt;/div&amp;gt;\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;60\&quot; y=\&quot;780\&quot; width=\&quot;750\&quot; height=\&quot;30\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;qnz8ibrbI4es2f5XtH8H-14\&quot; value=\&quot;4. Set up Vendor Product:&amp;lt;div&amp;gt;&amp;amp;nbsp;&amp;lt;div&amp;gt;&amp;lt;div&amp;gt;&amp;amp;nbsp;- if Product in Vendor Bill doesn&amp;#39;t correlate with a permitted activity type supposed to be included in PE Invoice, configure and add a&amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp; &amp;amp;nbsp;corresponding Product Template tag. Add Product Template tag translation.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;amp;nbsp;Example:&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;whiteSpace=wrap;rounded=0;\&quot; parent=\&quot;1\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;57\&quot; y=\&quot;880\&quot; width=\&quot;730\&quot; height=\&quot;30\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;qnz8ibrbI4es2f5XtH8H-15\&quot; value=\&quot;\&quot; style=\&quot;shape=image;verticalLabelPosition=bottom;labelBackgroundColor=default;verticalAlign=top;aspect=fixed;imageAspect=0;image=data:image/png,iVBORw0KGgoAAAANSUhEUgAABLYAAAKtCAIAAAC1xXCgAAAgAElEQVR4Aey9CXCUV4LnKbmnereiJ6Jbvb27qll2YTp6IyMqdgm7ZgmmmuqgvHhMLGzbxXgGpto2RDmM1VUllVGp1W6X3IIC2YBL5pRABgwYTGFbgEEYDKJoiQYbgXWlDtB9n+hMnXkpv933ne+7Xn6ZykupvyIDfcf73vF7T+L76V0JHL5AAARAAARAAARAAARAAARAAARAgCeQAA4gAAIgAAIgAAIgAAIgAAIgAAIgIBCAIqIlgAAIgAAIgAAIgAAIgAAIgAAIiASgiGgKIAACIAACIAACIAACIAACIAACIgEoIpoCCIAACIAACIAACIAACIAACICASACKiKYAAiAAAiAAAiAAAiAAAiAAAiAgEoAioimAAAiAAAiAAAiAAAiAAAiAAAiIBKCIaAogAAIgAAIgsNgJTExMdvX0tbR2NDS14gMCIAACILDICfhXxIrSB3lv5Wb+5Jfp61Ni+ZP5k1/mvZVbUfpgsf8/j/KDAAiAAAiAQCAEunr62ju7h0fHAnkIYcNIoKG
